[build]
  command = "npm run build"
  publish = "dist"

# تثبيت نسخة Node على Netlify: الكود والاختبارات مبنية على Node 20+،
# وتثبيتها يمنع أي انحراف في بيئة البناء بين المحلي والنشر.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# R1: كل طلبات /api/* تُمرَّر كـproxy (بحالة 200) إلى خادم Render الوحيد، بدل
# تشغيل server.ts داخل دالة Netlify. السبب الجذري: كان الموقع والـFunction يقرآن
# ويكتبان **نفس** جدول gharabi_state بنمط «آخر كاتب يفوز» مع خادم Render، فيمكن أن
# يمسح تعديل المالك بصمت (تضارب كتابة بين عمليتين). الآن **خادم واحد يكتب** فقط.
#
# الحالة 200 (rewrite/proxy) تحافظ على المسار الأصلي، وتُمرَّر الكوكيز وترويسات
# المصادقة (Authorization) كما هي، فتعمل الجلسات ومسارات OAuth بلا تغيير.
# ملف الدالة netlify/functions/api.ts يبقى في المستودع (لا حذف) لكنه لم يعد مستخدماً.
[[redirects]]
  from = "/api/*"
  to = "https://al-gharabi-ai.onrender.com/api/:splat"
  status = 200
  force = true

# SEC-01: مجلد dist/dr-source يحوي حزمة المصدر الكاملة (source.tar.gz + البيان +
# بصمة الالتزام). Netlify ينشر dist كأصول ثابتة فيخدمه علناً. هذه القاعدة تمنعه
# على الحافة بحالة 404 قبل قاعدة SPA، فلا يُعاد إلى index.html ولا يُخدَم الملف.
# تبقى حزمة المصدر متاحة داخلياً (تُقرأ من نظام الملفات في بناء نسخ DR) — لا حذف للأداة.
[[redirects]]
  from = "/dr-source/*"
  to = "/404.html"
  status = 404
  force = true

# SEC-01 (تكملة): حزمة الخادم المبنية `server.cjs` وملف الخريطة `server.cjs.map`
# (يحمل sourcesContent = الكود المصدري الكامل) كانا يُخدمان كأصول ثابتة علناً.
# نمنعهما على الحافة بحالة 404 قبل قاعدة SPA.
[[redirects]]
  from = "/server.cjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.cjs.map"
  to = "/404.html"
  status = 404
  force = true

# تطبيق React أحادي الصفحة: أي مسار غير API يُخدم من index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
