[build]
  command = "npm run build"
  publish = "dist"

# تثبيت نسخة Node على Netlify: الكود والاختبارات مبنية على Node 20+،
# وتثبيتها يمنع أي انحراف في بيئة البناء بين المحلي والنشر.
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# كل طلبات /api/* تُعاد كتابتها إلى دالة Express الموحّدة.
# الحالة 200 (rewrite) تحافظ على المسار الأصلي داخل event.path،
# فيرى Express مساراته كما هي (/api/health, /api/auth/...).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SEC-01: مجلد dist/dr-source يحوي حزمة المصدر الكاملة (source.tar.gz + البيان +
# بصمة الالتزام). Netlify ينشر dist كأصول ثابتة فيخدمه علناً. هذه القاعدة تمنعه
# على الحافة بحالة 404 قبل قاعدة SPA، فلا يُعاد إلى index.html ولا يُخدَم الملف.
# تبقى حزمة المصدر متاحة داخلياً (تُقرأ من نظام الملفات في بناء نسخ DR) — لا حذف للأداة.
[[redirects]]
  from = "/dr-source/*"
  to = "/404.html"
  status = 404
  force = true

# SEC-01 (تكملة): حزمة الخادم المبنية `server.cjs` وملف الخريطة `server.cjs.map`
# (يحمل sourcesContent = الكود المصدري الكامل) كانا يُخدمان كأصول ثابتة علناً.
# نمنعهما على الحافة بحالة 404 قبل قاعدة SPA.
[[redirects]]
  from = "/server.cjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.cjs.map"
  to = "/404.html"
  status = 404
  force = true

# تطبيق React أحادي الصفحة: أي مسار غير API يُخدم من index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
