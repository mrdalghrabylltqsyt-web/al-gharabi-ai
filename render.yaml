# Render Blueprint — خطة Free (بلا قرص دائم).
#
# مهم: على خطة Free لا يوجد Persistent Disk، لذا لا يمكن الاعتماد على ملف الحالة
# المحلي. اضبط DATABASE_URL (Neon Free) ليتحوّل التخزين تلقائياً إلى Postgres.
# بدون DATABASE_URL يعمل الخادم لكن يُعلن /api/health أن persistence.mode=ephemeral
# وتُفقد الحالة (الإبطال، اتصالات المنصات، مساحة العمل) عند كل إعادة نشر.
#
# لا تُكتب أي قيم سرية هنا. كل المتغيرات الحساسة sync: false تُدخَل من لوحة Render.
services:
  - type: web
    name: al-gharabi-ai
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      # Node 20 مثبّتة: الكود والاختبارات مبنية على Node 20+.
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Render يضبط PORT تلقائياً؛ الخادم يقرأ process.env.PORT ويستمع على 0.0.0.0.

      # --- أسرار: تُدخَل من لوحة Render ولا تُكتب هنا (sync: false) ---
      - key: SESSION_SECRET
        sync: false
      - key: PLATFORM_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      # جدار حماية الحصة المجانية: حد محلي يومي (1-120، افتراضي 40) ووضع حماية
      # مركزي واحد لكل المنصات. ليسا سرّين، ويُعلنان في /api/health و/api/readiness.
      # أي قيمة >120 تُقصّ عند الحد الآمن فلا يمكن تعطيل الحارس بالبيئة.
      - key: GEMINI_DAILY_LIMIT
        value: "40"
      - key: GEMINI_FREE_TIER_PROTECTION
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      # DATABASE_URL: اتصال Neon Free. بدونه يكون التخزين عابراً (ephemeral).
      - key: DATABASE_URL
        sync: false
      # --- منظومة التعافي الكامل (DR) — Google Drive (نطاق drive.file حصراً) ---
      # اعتماد OAuth لتطبيق Drive المستقل + مفتاح تشفير رمز التجديد + المفتاح
      # الرئيسي لفكّ الأسرار ونسخة قاعدة البيانات. كلها أسرار: sync: false.
      - key: DRIVE_OAUTH_CLIENT_ID
        sync: false
      - key: DRIVE_OAUTH_CLIENT_SECRET
        sync: false
      - key: DRIVE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DR_RECOVERY_MASTER_KEY
        sync: false
      - key: DRIVE_DB_BACKUP_KEY
        sync: false
      # مفتاح خزنة الطوارئ (KEY-VAULT/) — مستقل تماماً ولا يُحفظ داخل Drive.
      - key: DR_RECOVERY_VAULT_KEY
        sync: false
      # قاعدة بيانات معزولة لاختبار الاستعادة فقط (لا تستخدم الإنتاج).
      - key: DR_RECOVERY_TEST_DATABASE_URL
        sync: false
      # اختياري: فاصل النسخة الكاملة التلقائية. فارغ => الافتراضي 6 ساعات.
      - key: DR_AUTO_BACKUP_INTERVAL_MS
        sync: false
      # اختياري: عدد نقاط الاستعادة المكتملة المحفوظة (افتراضياً 3).
      - key: DR_RETENTION_KEEP
        sync: false
      # اختياري: نقاط محميّة لا تُحذف (افتراضياً rp-002,rp-003,rp-004).
      - key: DR_RETENTION_PROTECTED_IDS
        sync: false
      # اختياري: false لتعطيل التقليم التلقائي كلياً (افتراضاً مفعّل).
      - key: DR_AUTO_RETENTION
        sync: false
      # اختياري: معطّل افتراضياً. لا تضبطه إلا لقصد الدخول المباشر.
      - key: GHARABI_PREVIEW_TOKEN
        sync: false
      # موصل Telegram الحقيقي (Batch 5). رمز البوت وسرّ webhook أسرار من لوحة Render.
      # بدونهما يظهر Telegram "غير متصل" ولا يُنفَّذ أي إرسال خارجي.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # اختياري: دردشة/قناة افتراضية لتنفيذ المهام المجدولة (publish).
      - key: TELEGRAM_DEFAULT_CHAT_ID
        sync: false

      # --- Batch 6: بيانات OAuth لمزودي المنصات (تُدخَل من لوحة Render، sync: false) ---
      # بدونها يبقى كل مزود "EXTERNAL_SETUP_REQUIRED" ولا يبدأ أي ربط فعلي.
      # Google (YouTube + Google Business Profile):
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # TikTok (Login Kit + Content Posting API + Display API):
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # Optional comma override of TikTok scopes (only official, implemented
      # scopes are accepted; the required set is always included).
      - key: TIKTOK_OAUTH_SCOPES
        sync: false
      # Optional: override the TikTok URL-prefix verification token if TikTok
      # issues a new one (public by design; served at /tiktok<token>.txt).
      - key: TIKTOK_VERIFICATION_TOKEN
        sync: false
      # Meta (Facebook):
      - key: FACEBOOK_OAUTH_CLIENT_ID
        sync: false
      - key: FACEBOOK_OAUTH_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_VERIFY_TOKEN
        sync: false
      # Facebook Login for Business Configuration ID (optional; digits only).
      # When set, OAuth sends config_id instead of scope. Value entered in the
      # Render dashboard only — never in Git and never logged.
      - key: FACEBOOK_LOGIN_CONFIG_ID
        sync: false
      # Meta (Instagram):
      - key: INSTAGRAM_OAUTH_CLIENT_ID
        sync: false
      - key: INSTAGRAM_OAUTH_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false
      # Instagram Login for Business Configuration ID (digits only).
      # REQUIRED when the Meta app is a Business app: the dialog then uses the
      # Business Login surface, which reads permissions from a Configuration
      # (config_id) instead of scope. With scope and no config_id Meta shows
      # "Sorry, something went wrong" after login and returns no code.
      # Highest priority; falls back to FACEBOOK_LOGIN_CONFIG_ID.
      # Copy it from Meta App Dashboard → Facebook Login for Business →
      # Configurations. Never put the value in the repository or logs.
      - key: INSTAGRAM_LOGIN_CONFIG_ID
        sync: false
      # Optional explicit bypass of the "Business Login requires config_id" block.
      # Leave unset (safe default: block with an actionable 409). Set to "true"
      # only if Meta is proven to cover the permissions via the Use Case instead.
      - key: META_ALLOW_SCOPE_WITHOUT_CONFIG
        sync: false
      # Optional switch for Meta's unified onboarding window (extras=IG_API_ONBOARDING).
      # Leave unset to keep the documented flow. Set to "false" to use the regular
      # code flow if Meta's onboarding dialog fails after login (error 1850019).
      - key: INSTAGRAM_OAUTH_ONBOARDING
        sync: false
      # X / Twitter:
      - key: X_OAUTH_CLIENT_ID
        sync: false
      - key: X_OAUTH_CLIENT_SECRET
        sync: false
      # Snapchat:
      - key: SNAPCHAT_OAUTH_CLIENT_ID
        sync: false
      - key: SNAPCHAT_OAUTH_CLIENT_SECRET
        sync: false
      # Threads (Meta):
      - key: THREADS_OAUTH_CLIENT_ID
        sync: false
      - key: THREADS_OAUTH_CLIENT_SECRET
        sync: false
      - key: THREADS_APP_SECRET
        sync: false
      - key: THREADS_VERIFY_TOKEN
        sync: false
      # WhatsApp Cloud API (token وليس OAuth):
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false