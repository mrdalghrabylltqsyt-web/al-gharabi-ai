# خدمة استعادة الغرابي AI — Render منفصل تماماً عن خدمة الغرابي الرئيسية.
# الغرض: تبقى متاحة ولو توقّف تطبيق الغرابي أو واجهته أو جلسته.
services:
  - type: web
    name: gharabi-recovery-center
    runtime: node
    plan: free
    rootDir: dr-recovery-center
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    # autoDeploy مفعّل: بلا ذلك لا يستلم المركز أي إصلاح مدموج إلى main، فيبقى
    # يخدم نسخة قديمة بصمت (وهو ما أخفى سابقاً إصلاح قراءة رمز التجديد من قاعدة
    # الحالة: health بلا كتلة drive و/api/points يفشل بـno_refresh_token).
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RECOVERY_CENTER_HOSTED
        value: "true"
      # اعتماد OAuth لعميل Drive (نفس عميل «AI-Gharabi AI — Google Drive Backup»).
      - key: DRIVE_OAUTH_CLIENT_ID
        sync: false
      - key: DRIVE_OAUTH_CLIENT_SECRET
        sync: false
      # DRIVE_TOKEN_ENCRYPTION_KEY: نفس مفتاح تشفير رمز التجديد في تطبيق الغرابي.
      # يقرأه المركز لفكّ رمز التجديد المخزّن مشفّراً داخل جدول الحالة — بلا نقل أي
      # رمز نصي صريح إلى هذه الخدمة (لا DRIVE_OAUTH_REFRESH_TOKEN هنا).
      - key: DRIVE_TOKEN_ENCRYPTION_KEY
        sync: false
      # DR_STATE_DATABASE_URL: اتصال **قراءة فقط** بجدول حالة الغرابي (Neon) الذي
      # يحمل كتلة `control` وفيها رمز التجديد مشفّراً. يُفضَّل هذا على نقل الرمز:
      # لا سرّ جديد، ولا رمز نصي، ويُفكّ بمفتاح التشفير نفسه. (بديل قديم مقبول:
      # DR_RECOVERY_STATE_DATABASE_URL.) لا يُستخدم هذا الاتصال إلا لقراءة الرمز.
      - key: DR_STATE_DATABASE_URL
        sync: false
      # DRIVE_OAUTH_REFRESH_TOKEN: توافق خلفي اختياري فقط. لا تضبطه — الأفضل
      # ترك الرمز مشفّراً في قاعدة الحالة (أعلاه) بدل نقله نصاً صريحاً.
      - key: DRIVE_OAUTH_REFRESH_TOKEN
        sync: false
      # مفتاح فكّ الأسرار/القاعدة (اسم واحد يكفي).
      - key: DRIVE_DB_BACKUP_KEY
        sync: false
      - key: DR_RECOVERY_MASTER_KEY
        sync: false
      # اختياري: معرّفات مجلدات Drive تحت drive.file (من /api/dr/health.dr.sourceCollection).
      - key: DR_FOLDER_IDENTITY
        sync: false
      # اختياري: قاعدة هدف معزولة لاستعادة القاعدة (تُرفض إن طابقت DATABASE_URL).
      - key: DR_RECOVERY_TEST_DATABASE_URL
        sync: false
      # RECOVERY_CENTER_OWNER_TOKEN: **مصادقة المالك لهذه الخدمة المستقلة** (إلزامية).
      # بدونه تُرد المسارات التي تكشف بيانات وصفية لنقاط الاستعادة أو تنفّذ استعادة
      # (/api/points · /api/verify · /api/restore) بـ401. يُرسَل كـBearer، ولا يُوضع
      # في Git. بديل: RECOVERY_CENTER_OWNER_TOKEN_HASH (SHA-256 hex للمفتاح نفسه).
      - key: RECOVERY_CENTER_OWNER_TOKEN
        sync: false
      - key: RECOVERY_CENTER_OWNER_TOKEN_HASH
        sync: false
      # ملاحظة: DR_RECOVERY_VAULT_KEY **لا يُضبط هنا إطلاقاً** — يُدخله المالك في الواجهة فقط.
