# نبضة إيقاظ محدودة النطاق الزمني للخدمة الرئيسية al-gharabi-ai.
#
# سبب القرار (لا يُوسَّع لـ24/7 أبداً):
#   خطة Render المجانية تمنح 750 ساعة تشغيل شهرياً لكل Workspace كاملة، مشتركة بين
#   al-gharabi-ai وgharabi-recovery-center معاً. نبضة 24/7 تستهلك ~744 ساعة بمفردها
#   وتعرّض كل الخدمات المجانية للتعليق عند تجاوز الحصة — وهذا يخالف مبدأ «المشروع
#   يبقى مجانياً للأبد» المُقرَّر صراحة. لذلك النبضة محصورة بنافذة 18 ساعة فقط يومياً.
#
# النطاق المعتمد:
#   - 06:00 → 24:00 بتوقيت بغداد (UTC+3) = 03:00 → 21:00 UTC.
#   - خارج هذا النطاق (منتصف الليل حتى 6 صباحاً بغداد) لا نبضة إطلاقاً؛ تُترك الخدمة
#     تنام طبيعياً. الهامش الطبيعي: آخر نبضة 20:50 UTC تُبقي الصحو حتى قرب 21:00 UTC
#     (= منتصف الليل بغداد) تقريباً.
#   - مركز التعافي gharabi-recovery-center بلا أي تغيير (نادر الزيارة، ساعات ضئيلة).
#
# الطلب خفيف عمداً: GET واحد على /api/health فقط — لا يستدعي Gemini ولا أي منطق ثقيل،
# وغرضه الوحيد إبقاء عملية الخدمة صاحية.
#
# GitHub Actions مجانية بلا حدود هنا لأن الريبو عام — فلا تكلفة إضافية، ولا خدمة خارجية.
name: Keep-Alive Ping (18h window)

on:
  # كل 10 دقائق بين 03:00 و20:59 UTC فقط (= 06:00 → 23:59 بتوقيت بغداد UTC+3).
  # لا تشغيل بين 21:00 و02:59 UTC (نوم طبيعي — منتصف الليل حتى 6 صباحاً بغداد).
  schedule:
    - cron: "*/10 3-20 * * *"
  # للاختبار اليدوي فقط (لا يغيّر النطاق المجدول أعلاه).
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health (best-effort)
        # best-effort: فشل الطلب لا يُفشل الـworkflow (قد تكون الخدمة في أول ثانية إيقاظ).
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://al-gharabi-ai.onrender.com/api/health || echo "000")
          echo "UTC now: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HTTP status: ${code}"
          # ملاحظة: لا نستخدم exit 1 عند الفشل — النبضة best-effort فقط.
