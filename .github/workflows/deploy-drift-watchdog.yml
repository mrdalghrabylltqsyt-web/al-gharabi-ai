# حارس انحراف النشر — يمنع الصمت الممتد «compliance» بين آخر commit على main والإنتاج.
#
# سبب القرار (لا يُختلق): رُصد فعلياً أن الإنتاج خدم commit قديماً (038830f من 04:58Z)
# لساعات بينما دُفعت 6 commits إلى main (05:56Z→09:02Z) دون أي إعادة نشر — بلا تنبيه.
# الاعتماد على auto-deploy وحده لا يكفي لأنه صامت عند الفشل/التخطّي. هذا الحارس يقارن
# commit الإنتاج الفعلي (من /api/health الحي) بآخر commit على main، ويفتح/يحدّث تذكرة
# واحدة عند الانحراف، فيتحوّل العطل الصامت إلى إشعار مرئي.
#
# لا يكلف شيئاً: GitHub Actions مجاني للريبو العام، والطلب خفيف (GET واحد على /api/health).
# لا يلمس Render ولا أي سرّ — قراءة فقط.
#
# إصلاح (مثبّت من التشغيل #37950528349):
#  1) المقارنة النصّية الساذجة صنّفت `bb004fef…` مقابل `bb004fe` (نفس الالتزام) كـ drift.
#     الآن المقارنة بمنطق `scripts/deploy-drift/lib.mjs` (بادئة صحيحة، والفارغ ≠ متطابق).
#  2) خطوة البلاغ فشلت بـ «fatal: not a git repository» لأن gh احتاج سياق مستودع ولا checkout.
#     الآن كل أمر gh يحمل `--repo` صراحةً (وأُضيف checkout احتياطاً).
name: Deploy Drift Watchdog

on:
  # كل 30 دقيقة داخل نافذة الصحو (03:00→20:59 UTC) — نفس نافذة نبضة الإبقاء.
  schedule:
    - cron: "*/30 3-20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      # النطاق لا يحتاج git، لكن الـcheckout يجعل السياق متاحاً لكل أمر gh احتياطاً
      # فوق تمرير `--repo` الصريح الذي يُغني عنه أصلاً (سبب «not a git repository» سابقاً).
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 (نفس نسخة الإنتاج): fetch/AbortSignal متاحة، فالمشغّل بلا اعتماديات.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compare production commit vs main HEAD (live)
        id: cmp
        env:
          REPO: ${{ github.repository }}
          PROD_URL: https://al-gharabi-ai.onrender.com/api/health
        run: node scripts/deploy-drift/run.mjs

      - name: Report drift (single tracking issue)
        if: steps.cmp.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.cmp.outputs.head }}
          PROD: ${{ steps.cmp.outputs.prod }}
          REASON: ${{ steps.cmp.outputs.reason }}
        run: node scripts/deploy-drift/report.mjs
